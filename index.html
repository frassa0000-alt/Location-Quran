    <script>
      // Self-heal stale caches from prior versions to ensure latest UI loads
      try {
        if ('serviceWorker' in navigator) {
          var PURGE_TAG = 'el_quran_cache_purge_v7';
          if (localStorage.getItem(PURGE_TAG) !== '1') {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            });
            if ('caches' in window) {
              caches.keys().then(function(names) {
                for (var j = 0; j < names.length; j++) {
                  if (names[j] !== 'quran-audio-cache-v1') {
                    caches.delete(names[j]);
                  }
                }
              });
            }
            localStorage.setItem(PURGE_TAG, '1');
          }
        }
      } catch (e) {
        console.warn('Cache purge info:', e);
      }
    </script>
